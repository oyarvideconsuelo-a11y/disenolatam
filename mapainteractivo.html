<body>

  <!-- ====================================================================
       MAPA INTERACTIVO
       Un pin por país. La posición sale de las coordenadas de data/paises.json:
         left = (lng + 120) / 90 * 100      top = (35 - lat) / 93 * 100
       (recuadro de América Latina, de lng -120 a -30 y de lat 35 a -58).
       El fondo de .map-canvas debe ser un mapa con ese mismo recuadro.

       Alternativa: embeber el mapa que el esquicio ya usa en Google My Maps
       <iframe src="https://www.google.com/maps/d/embed?mid=1P1PX3zUvFttnEuF9uI9YXmtekLvF7zc" width="640" height="480" title="Mapa del esquicio"></iframe>
       ==================================================================== -->
  <main id="content" class="site-main">
    <header class="page-header">
      <h1>Mapa interactivo</h1>
      <p class="page-lead">Elegí un país para ver sus fichas.</p>
    </header>

    <div class="map-layout">
      <div class="map-canvas" role="group" aria-label="Mapa de fichas por país">
        <button class="map-pin" type="button" style="left: 53.9%; top: 76.0%" aria-pressed="true" aria-label="Chile: 2 fichas" data-pais="CL"></button>
        <button class="map-pin" type="button" style="left: 19.3%; top: 12.3%" aria-pressed="false" aria-label="México: 1 ficha" data-pais="MX"></button>
        <button class="map-pin" type="button" style="left: 75.7%; top: 52.9%" aria-pressed="false" aria-label="Brasil: 1 ficha" data-pais="BR"></button>
        <button class="map-pin" type="button" style="left: 51.0%; top: 32.7%" aria-pressed="false" aria-label="Colombia: 1 ficha" data-pais="CO"></button>
        <button class="map-pin" type="button" style="left: 71.3%; top: 72.6%" aria-pressed="false" aria-label="Uruguay: 1 ficha" data-pais="UY"></button>
      </div>

      <aside class="map-card" aria-live="polite">
        <h2>Chile</h2>
        <p class="map-card-count">2 fichas</p>
        <ul>
          <li><a href="entrada.html?slug=institucion-de-ejemplo-1">Institución de ejemplo 1</a></li>
          <li><a href="entrada.html?slug=institucion-de-ejemplo-6">Institución de ejemplo 6</a></li>
        </ul>
      </aside>
    </div>
  </main>


<!-- ======================================================================
     SCRIPTS (todavía no escritos: esta página es la estructura)
     js/entradas.js lo genera scripts/build-entradas.mjs: window.ENTRADAS y window.ENTRADAS_META.
       <script src="js/entradas.js"></script>
       <script src="js/mapa.js"></script>   crea los pines, y al elegir uno completa .map-card con las fichas del país
     ====================================================================== -->
<script>
  // Menú móvil, submenú "Archivo" y cierre con Escape
  (function () {
    var nav = document.getElementById('site-navigation');
    var toggle = document.querySelector('.menu-toggle');
    toggle.addEventListener('click', function () {
      toggle.setAttribute('aria-expanded', nav.classList.toggle('is-open'));
    });
    document.querySelectorAll('.sub-menu-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.setAttribute('aria-expanded', btn.parentElement.classList.toggle('is-open'));
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      document.querySelectorAll('.is-open').forEach(function (el) { el.classList.remove('is-open'); });
    });
  })();
</script>
</body>
